<!-- Modern Tailwind Voucher Card -->
<div class="text-center space-y-1">
    <!-- Price Badge -->
    <div class="inline-flex items-center justify-center px-3 py-1.5 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold text-base rounded-lg shadow-md">
        [[price]]
    </div>
    
    <!-- Voucher Code -->
    <div class="bg-gray-50 border-2 border-dashed border-gray-300 rounded-lg px-2 py-1.5">
        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Code</div>
        <div class="text-sm font-mono font-bold text-gray-900 tracking-wider">[[voucher_code]]</div>
    </div>
    
    <!-- Plan Details -->
    <div class="text-xs">
        <div class="font-semibold text-gray-700">[[plan]]</div>
        <div class="text-gray-500">Validity: <span class="font-medium text-gray-700">[[expiry]] days</span></div>
    </div>
</div>
